modLoader = "javafml"
loaderVersion = "[2,)"
#issueTrackerURL = ""
license = "All Rights Reserved"

[[mods]]
modId = "create_crops"
version = "${version}"
displayName = "Create Crops"
authors = "alexzander700"
description = '''
Create: Crops is a library mod meant to add the Crops needed for other mods of mine, such as Create: Italian Industries. If Create: Farming Essentials is loaded, you can use the Trellis with crops compatible with it.
'''
#logoFile = ""

[[dependencies.create_crops]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.create_crops]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.create_crops]]
modId = "architectury"
type = "required"
versionRange = "[13.0.11,)"
ordering = "AFTER"
side = "BOTH"

# Optional: lets tomatoes be planted in the Trellis. "[0,)" because a "1.0-SNAPSHOT" version
# sorts *below* 1.0 and would be rejected by "[1.0,)".
[[dependencies.create_crops]]
modId = "create_farming_essentials"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Optional: tomatoes can be fired from Create's Potato Cannon.
[[dependencies.create_crops]]
modId = "create"
type = "optional"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "create_crops.mixins.json"
