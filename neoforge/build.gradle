plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = 'https://maven.createmod.net' }                // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' }       // Registrate
    maven { url = 'https://maven.ithundxr.dev/mirror' }          // Registrate (mirror)
    maven { url = 'https://modmaven.dev' }
}

// Same Create setup as Create: Farming Essentials. Versions come from gradle.properties if set there
// (nf_create_version, ...), otherwise these defaults are used.
def createVersion = findProperty('nf_create_version') ?: '6.0.10-280'
def ponderVersion = findProperty('nf_ponder_version') ?: '1.0.82'
def flywheelVersion = findProperty('nf_flywheel_version') ?: '1.0.6'
def registrateVersion = findProperty('nf_registrate_version') ?: 'MC1.21-1.3.0+67'
// Create is an OPTIONAL dependency of this mod, so it is only compiled against. Set
// dev_run_with_create=false in gradle.properties (or pass -Pdev_run_with_create=false) to start the dev
// client WITHOUT Create and test the "Create not installed" path.
def devRunWithCreate = (findProperty('dev_run_with_create') ?: 'true').toString().toBoolean()
def mc = rootProject.minecraft_version

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Create (compile only)
    modCompileOnly("com.simibubi.create:create-${mc}:${createVersion}:slim") { transitive = false }
    modCompileOnly "net.createmod.ponder:ponder-neoforge:${ponderVersion}+mc${mc}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${mc}:${flywheelVersion}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-neoforge-${mc}:${flywheelVersion}"
    modCompileOnly "com.tterrag.registrate:Registrate:${registrateVersion}"

    // Create (dev runs only, never part of the published jar)
    if (devRunWithCreate) {
        modLocalRuntime("com.simibubi.create:create-${mc}:${createVersion}:slim") { transitive = false }
        modLocalRuntime "net.createmod.ponder:ponder-neoforge:${ponderVersion}+mc${mc}"
        modLocalRuntime "dev.engine-room.flywheel:flywheel-neoforge-${mc}:${flywheelVersion}"
        modLocalRuntime "com.tterrag.registrate:Registrate:${registrateVersion}"
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
